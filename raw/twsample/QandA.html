        $("#togglePasswordBtn").click(function () {

            console.log('開關驗證碼可視');
            var passwordInput = document.getElementById("GetCaptchaText");
            var eyeIcon = document.getElementById("eyeIcon");

            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                eyeIcon.classList.remove("bi-eye-slash");
                eyeIcon.classList.add("bi-eye");
            } else {
                passwordInput.type = "password";
                eyeIcon.classList.remove("bi-eye");
                eyeIcon.classList.add("bi-eye-slash");
            }
        });
    

    </script>

<script>
    if ('QandA' == "Home") {
        $("#PageClient").css("background-color", "var(--custom-btn-bg-color)");
        $("#PageClient").css("color", "var(--white-color)");
        //background - color: var(--custom - btn - bg - color);
    }
    else if ('QandA' == "Server"){
        $("#PageServer").css("background-color", "var(--custom-btn-bg-color)");
        $("#PageServer").css("color", "var(--white-color)");
    }
    else if ('QandA' == "QandA"){
        $("#PageQandA").css("background-color", "var(--custom-btn-bg-color)");
        $("#PageQandA").css("color", "var(--white-color)");
    }
    else if ('QandA' == "User"){
        $("#PageUser").css("background-color", "var(--custom-btn-bg-color)");
        $("#PageUser").css("color", "var(--white-color)");
}
    var currentPath = window.location.pathname;

    var navLinks = document.querySelectorAll('.nav-link');
    navLinks.forEach(function (link) {
        if (link.getAttribute('href') === currentPath) {
            link.classList.add('active'); // 如果匹配，则添加 'active' 类
        }
    });


    // 看看有沒有登入: UserLoginOrNot


    function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(';').shift();
    }
    var btn_UserLoginOrNot = document.getElementById('UserLoginOrNot');
    if (getCookie("Account") != null) {

        btn_UserLoginOrNot.innerText = "登出";
        //alert(getCookie("Account"));
    }
    else {
        btn_UserLoginOrNot.innerText = "登入";
    }

</script>
